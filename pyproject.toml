[project]
name = "storm-fronts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mich3leRusso", email = "michele00russo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cartopy>=0.26.0",
    "cdsapi>=0.7.7",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.4",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "torch>=2.14.1",
    "xarray>=2026.9.0",
]

[project.scripts]
storm-fronts = "storm_fronts:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

# CPU-only PyTorch (the CUDA build is several GB and not needed for one storm)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
